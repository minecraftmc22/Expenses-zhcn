name: Android Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Android SDK command line tools need a modern JDK, while this
      # 2019-era Gradle/AGP toolchain has to run on JDK 8. Install the SDK
      # packages first with JDK 17, then switch JAVA_HOME to JDK 8.
      - name: Set up JDK 17 for the Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to 'tools platform-tools', but the obsolete
          # 'tools' package no longer exists in the SDK repository and makes
          # the action fail. Only request packages that still exist.
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          # setup-android calls sdkmanager by absolute path, so resolve it here
          # as well and fall back to the SDK copy installed on the runner.
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-29" "build-tools;29.0.2" "build-tools;28.0.3"

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using google-services.json from the GOOGLE_SERVICES_JSON secret."
          else
            cp app/google-services.json.ci app/google-services.json
            echo "GOOGLE_SERVICES_JSON is not set - using the bundled placeholder config."
            echo "::warning::GOOGLE_SERVICES_JSON is not set, so this build uses the placeholder Firebase config. Google sign-in WILL fail with error 10 in the resulting APK."
          fi

      - name: Build release and debug APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          MISSING=""
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then MISSING="$MISSING RELEASE_KEYSTORE_BASE64"; fi
          if [ -z "$RELEASE_STORE_PASSWORD" ]; then MISSING="$MISSING RELEASE_STORE_PASSWORD"; fi
          if [ -z "$RELEASE_KEY_ALIAS" ]; then MISSING="$MISSING RELEASE_KEY_ALIAS"; fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then MISSING="$MISSING RELEASE_KEY_PASSWORD"; fi

          if [ -n "$MISSING" ]; then
            echo "::warning::Signing secrets are incomplete, missing:$MISSING"
            echo "The release APK will be UNSIGNED and cannot be installed. Add the missing"
            echo "secrets under Settings -> Secrets and variables -> Actions -> Secrets."
            ./gradlew --no-daemon assembleProdDebug assembleProdRelease
          else
            echo "Signing the release APK with the keystore from secrets."
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            ./gradlew --no-daemon assembleProdDebug assembleProdRelease \
              -PEXPENSES_STORE_FILE="$GITHUB_WORKSPACE/release.jks" \
              -PEXPENSES_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PEXPENSES_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PEXPENSES_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          fi

      - name: Check produced APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          find app/build/outputs/apk -name '*.apk' -print
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] \
             && [ -n "$(find app/build/outputs/apk -name '*-unsigned.apk' -print -quit)" ]; then
            echo "::error::An unsigned APK was produced even though RELEASE_KEYSTORE_BASE64 is set."
            echo "Check that all four signing secrets are non-empty and that RELEASE_KEYSTORE_BASE64"
            echo "really is the Base64 of a .jks file."
            exit 1
          fi
          if grep -qa "PLACEHOLDER-NOT-A-REAL-WEB-CLIENT-ID" app/build/outputs/apk/prod/release/*.apk 2>/dev/null; then
            echo "::warning::The produced APK contains the placeholder Firebase config, so Google sign-in will fail with error 10. Set the GOOGLE_SERVICES_JSON secret and re-run."
          else
            echo "The produced APK carries a real Firebase config (no placeholder strings found)."
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: expenses-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
