name: Keystore fingerprint

# Manual helper. Prints the SHA-1 / SHA-256 of the keystore that signs release
# APKs, so the fingerprint can be registered in the Firebase project for Google
# sign-in. Run it from Actions -> Keystore fingerprint -> Run workflow.
#
# Fingerprints are public information (they can be read out of any signed APK),
# so printing them into the log is fine. The passwords are never printed.

on:
  workflow_dispatch:

jobs:
  fingerprint:
    name: Print signing certificate fingerprints
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Print fingerprints of the release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set, so there is no release keystore to inspect."
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          echo "=== Copy the SHA1 line into Firebase. Google sign-in needs SHA-1;"
          echo "=== SHA256 is optional and cannot be used instead of it. ==="
          if [ -n "$RELEASE_KEY_ALIAS" ]; then
            keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" \
              | grep -E "Alias name:|Valid from:|SHA1:|SHA256:"
          else
            keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass "$RELEASE_STORE_PASSWORD" \
              | grep -E "Alias name:|Valid from:|SHA1:|SHA256:"
          fi
